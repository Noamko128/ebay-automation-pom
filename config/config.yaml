# Data-driven environment configuration.
# Select a profile with the TEST_ENV env var (defaults to "mock"). Any value here can be
# overridden by an environment variable of the same name in UPPER_SNAKE_CASE
# (e.g. BASE_URL=... overrides base_url for whichever profile is active).
default_profile: mock

profiles:
  mock:
    # Local mock eBay site (see mock_site/). Deterministic, fast, no bot detection - the suite
    # is expected to be run against this profile in CI and during grading.
    base_url: "http://127.0.0.1:5057"
    currency_symbol: "$"
    search_path: "/sch/i.html"
    request_timeout_ms: 10000

  live:
    # Real eBay. Kept for manual/local demo purposes only - see README "Limitations": eBay's
    # bot/CAPTCHA protection returns HTTP 403 to non-browser and often to automated browser
    # traffic, so this profile is not guaranteed to run unattended or in CI.
    base_url: "https://www.ebay.com"
    currency_symbol: "$"
    search_path: "/sch/i.html"
    request_timeout_ms: 20000

browser:
  name: chromium # chromium | firefox | webkit
  headless: true
  slow_mo_ms: 0
  viewport:
    width: 1440
    height: 900

paths:
  screenshots_dir: "screenshots"
  allure_results_dir: "reports/allure-results"
